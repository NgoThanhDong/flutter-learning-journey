name: projects_app
description: "Phase 8: Real Projects - Portfolio Apps cho Flutter learners"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  
  # ============================================================================
  # STATE MANAGEMENT
  # ============================================================================
  flutter_bloc: ^8.1.6      # BLoC/Cubit pattern
  equatable: ^2.0.5         # Object comparison cho States
  
  # ============================================================================
  # DEPENDENCY INJECTION
  # ============================================================================
  get_it: ^8.0.3            # Service locator
  
  # ============================================================================
  # NETWORKING
  # ============================================================================
  http: ^1.2.0              # HTTP client cho API calls
  
  # ============================================================================
  # LOCAL STORAGE
  # ============================================================================
  shared_preferences: ^2.3.0  # Key-value storage
  
  # ============================================================================
  # NAVIGATION
  # ============================================================================
  go_router: ^14.8.1        # Declarative routing
  
  # ============================================================================
  # UI ENHANCEMENTS
  # ============================================================================
  google_fonts: ^6.2.1      # Custom fonts
  flutter_staggered_grid_view: ^0.7.0  # Grid layouts
  cached_network_image: ^3.4.1  # Image caching
  shimmer: ^3.0.0           # Loading skeleton
  intl: ^0.19.0             # Date/Number formatting
  
  # ============================================================================
  # UTILITIES
  # ============================================================================
  uuid: ^4.5.1              # Generate unique IDs

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
