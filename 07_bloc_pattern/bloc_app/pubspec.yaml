name: bloc_app
description: "A new Flutter project for learning BLoC pattern."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # BLoC Pattern
  flutter_bloc: ^8.1.3
  bloc_concurrency: ^0.2.2
  stream_transform: ^2.1.0
  equatable: ^2.0.5
  
  # DI & Networking
  get_it: ^8.0.0
  dio: ^5.4.0
  http: ^1.2.0 # Added for infinite list mock
  
  # Utilities
  provider: ^6.1.1
  fpdart: ^1.1.0
  
  # Local Storage (Optional for later exercises)
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
